name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Svelte diagnostics
        run: pnpm check

      - name: Build static site
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_TIMEOUT: ${{ vars.VITE_API_TIMEOUT }}
          VITE_APP_HOST: ${{ vars.VITE_APP_HOST }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_LOGIN_URL: ${{ vars.VITE_APP_LOGIN_URL }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_SUPPORT_PHONE_NUMBER: ${{ vars.VITE_SUPPORT_PHONE_NUMBER }}
          VITE_SUPPORT_ADDRESS: ${{ vars.VITE_SUPPORT_ADDRESS }}
          VITE_LANDING_PAGE_SECRET: ${{ secrets.VITE_LANDING_PAGE_SECRET }}
          VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ vars.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ vars.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ vars.VITE_REVERB_SCHEME }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preserve custom domain
        run: cp CNAME dist/CNAME

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
